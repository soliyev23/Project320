<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Soliyev Calculator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f4f4f5;
    }

    .card {
      background: #ffffff;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      max-width: 420px;
      width: 100%;
    }

    h1 {
      margin-top: 0;
      margin-bottom: 4px;
      font-size: 1.5rem;
      text-align: center;
    }

    .subtitle {
      margin: 0 0 20px;
      text-align: center;
      font-size: 0.9rem;
      color: #6b7280;
    }

    label {
      display: block;
      font-size: 0.9rem;
      margin-bottom: 6px;
      color: #374151;
    }

    input[type="number"],
    select {
      width: 100%;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid #d1d5db;
      font-size: 0.95rem;
      margin-bottom: 14px;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    input[type="number"]:focus,
    select:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 1px rgba(59, 130, 246, 0.3);
    }

    .row {
      display: flex;
      gap: 10px;
    }

    .row > div {
      flex: 1;
    }

    button {
      width: 100%;
      padding: 10px 14px;
      border-radius: 999px;
      border: none;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      background: #3b82f6;
      color: #ffffff;
      margin-top: 4px;
      transition: transform 0.1s, box-shadow 0.1s, background 0.15s;
    }

    button:hover {
      background: #2563eb;
      box-shadow: 0 6px 18px rgba(37, 99, 235, 0.35);
      transform: translateY(-1px);
    }

    button:active {
      transform: translateY(0);
      box-shadow: none;
    }

    .result-box {
      margin-top: 18px;
      padding: 12px 14px;
      border-radius: 12px;
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      font-size: 0.95rem;
    }

    .result-label {
      font-weight: 600;
      margin-bottom: 4px;
      color: #374151;
    }

    .result-value {
      font-size: 1.05rem;
      color: #111827;
    }

    .error {
      margin-top: 10px;
      font-size: 0.85rem;
      color: #b91c1c;
    }

    .api-base {
      font-size: 0.75rem;
      color: #9ca3af;
      text-align: center;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Soliyev API Frontend</h1>
    <p class="subtitle">Введите два числа и выберите операцию</p>

    <div class="row">
      <div>
        <label for="x">x</label>
        <input type="number" id="x" placeholder="Например, 3" step="any" />
      </div>
      <div>
        <label for="y">y</label>
        <input type="number" id="y" placeholder="Например, 4" step="any" />
      </div>
    </div>

    <label for="operation">Операция</label>
    <select id="operation">
      <option value="c2">Гипотенуза</option>
      <option value="soliyev">Произведение</option>
    </select>

    <button id="calculateBtn">Вычислить</button>

    <div class="result-box" id="resultBox" style="display: none;">
      <div class="result-label">Результат:</div>
      <div class="result-value" id="resultValue"></div>
    </div>

    <div class="error" id="errorBox" style="display: none;"></div>

    <div class="api-base">
      Ожидается, что API запущен на <code>http://localhost:8000</code>
    </div>
  </div>

  <script>
    // Измени это, если твой FastAPI запущен на другом хосте/порту
    const API_BASE = window.location.origin;

    const xInput = document.getElementById("x");
    const yInput = document.getElementById("y");
    const opSelect = document.getElementById("operation");
    const calcBtn = document.getElementById("calculateBtn");
    const resultBox = document.getElementById("resultBox");
    const resultValue = document.getElementById("resultValue");
    const errorBox = document.getElementById("errorBox");

    async function calculate() {
      errorBox.style.display = "none";
      resultBox.style.display = "none";

      const x = parseFloat(xInput.value);
      const y = parseFloat(yInput.value);

      if (isNaN(x) || isNaN(y)) {
        errorBox.textContent = "Пожалуйста, введите корректные числа для x и y.";
        errorBox.style.display = "block";
        return;
      }

      const operation = opSelect.value; // "c2" или "soliyev"
      const url = `${API_BASE}/${operation}`;

      try {
        const response = await fetch(url, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({ x, y }),
        });

        if (!response.ok) {
          throw new Error(`Ошибка сервера: ${response.status}`);
        }

        const data = await response.json();

        if (!("result" in data)) {
          throw new Error("Некорректный формат ответа от сервера");
        }

        resultValue.textContent = data.result;
        resultBox.style.display = "block";
      } catch (err) {
        errorBox.textContent = "Ошибка при запросе: " + err.message;
        errorBox.style.display = "block";
      }
    }

    calcBtn.addEventListener("click", calculate);

    // Нажатие Enter в полях запускает вычисление
    [xInput, yInput].forEach((input) => {
      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          calculate();
        }
      });
    });
  </script>
</body>
</html>
